<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <title>AgentHub</title>
  </head>
  <body>
    <!-- Anti-flash: apply saved theme + accent tokens before Vue mounts -->
    <script>
      (function(){
        var m = localStorage.getItem('agenthub-theme')
        var dark = m === 'dark' || ((!m || m === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        try {
          var tokens = JSON.parse(localStorage.getItem('agenthub-tokens') || 'null')
          if (tokens) {
            var root = document.documentElement
            for (var k in tokens) root.style.setProperty(k, tokens[k])
          }
        } catch(e) {}
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
